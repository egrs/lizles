<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <title>lizles — oefenen</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="drill-body">
  <header class="topbar topbar--drill">
    <a class="back" href="./" aria-label="Terug">‹ Terug</a>
    <h1 id="topic-title">…</h1>
    <button id="settings-btn" class="icon-btn" aria-label="Instellingen">⚙︎</button>
  </header>

  <div id="progress-bar" class="progress-bar"><div id="progress-fill"></div></div>

  <main id="drill" class="container drill">
    <p class="muted" id="loading">Oefeningen laden…</p>
  </main>

  <div id="settings-panel" class="settings-panel" hidden>
    <h2>Instellingen</h2>
    <label class="check"><input type="checkbox" id="opt-include-review"> Inclusief items met label “review”</label>
    <label class="check"><input type="checkbox" id="opt-weak-first" checked> Eerst zwakke punten</label>
    <button class="btn ghost" id="reset-progress">Reset voortgang voor dit onderwerp</button>
    <button class="btn" id="settings-close">Sluiten</button>
  </div>

  <script src="js/progress.js?v=4"></script>
  <script src="js/exercises.js?v=4"></script>
  <script src="js/drill.js?v=4"></script>
</body>
</html>
